version: 0.2

phases:
  install:
    runtime-version:
      java: OpenJDK25
  build:
    commands:
      - echo Building, Testing and packaging the application...
      - mvn package -DskipTests
  post-build:
    commands:
      - echo Build, Testing and packaging complete.
artifacts:
  files:
    - target/*.jar
  discard-paths: yes
cache:
  paths:
    - '/root/.m2/**/*'